name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (must already exist)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
        working-directory: web

      - run: npm run build
        working-directory: web

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o ztpanel-linux-amd64 ./cmd/ztpanel

      - run: gh release create "${{ inputs.tag || github.ref_name }}" --title "${{ inputs.tag || github.ref_name }}" --generate-notes --verify-tag ztpanel-linux-amd64 Dockerfile
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
